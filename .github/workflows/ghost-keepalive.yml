name: Ghost server keepalive

on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          GHOST_API_URL: ${{ vars.GHOST_API_URL }}
        run: |
          if [ -z "$GHOST_API_URL" ]; then
            echo "Repository variable GHOST_API_URL is not set. Skipping."
            exit 0
          fi
          curl --fail --silent --show-error --retry 4 --retry-delay 20 --retry-all-errors --max-time 90 "${GHOST_API_URL%/}/health"
